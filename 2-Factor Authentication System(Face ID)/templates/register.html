<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; height: 100vh; justify-content: center; align-items: center; background-color: #f9f9f9; }
        .form-box { background: #fff; padding: 40px; border-radius: 15px; box-shadow: 0px 0px 15px rgba(0,0,0,0.1); text-align: center; }
        input { display: block; margin: 15px auto; padding: 10px; width: 80%; border-radius: 8px; border: 1px solid #ccc; }
        button { padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Register</h2>
        <form action="/register" method="post">
            <input type="text" name="username" placeholder="Choose a username" required>
            <input type="password" name="password" placeholder="Choose a password" required>
            <button type="submit">Register</button>
        </form>
        <p><a href="/login">Back to Login</a></p>
    </div>
</body>
</html>
