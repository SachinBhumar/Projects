<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; height: 100vh; justify-content: center; align-items: center; background-color: #f0f0f0; }
        .form-box { background: #fff; padding: 40px; border-radius: 15px; box-shadow: 0px 0px 15px rgba(0,0,0,0.1); text-align: center; }
        input { display: block; margin: 15px auto; padding: 10px; width: 80%; border-radius: 8px; border: 1px solid #ccc; }
        button { padding: 10px 20px; background-color: #4285f4; color: white; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background-color: #3367d6; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Login</h2>
        <form action="/login" method="post">
            <input type="text" name="username" placeholder="Enter username" required>
            <input type="password" name="password" placeholder="Enter password" required>
            <button type="submit">Login</button>
        </form>
        <p><a href="/register">Register Here</a></p>
    </div>
</body>
</html>
